name: Embedded Pi Linux and Windows
on:
  push:
    paths:
      - 'cmd-proxy-app/src/main/resources/embedded/pi/**'
      - 'scripts/*embedded-pi.mjs'
      - '.github/workflows/embedded-pi.yml'
  pull_request:
    paths:
      - 'cmd-proxy-app/src/main/resources/embedded/pi/**'
      - 'scripts/*embedded-pi.mjs'
      - '.github/workflows/embedded-pi.yml'
jobs:
  system-node-runtime:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        node: ['22.19.0', '24']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '8'
      - run: node scripts/test-embedded-pi.mjs
