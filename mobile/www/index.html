<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; connect-src 'none'; object-src 'none'; base-uri 'none'">
  <meta name="color-scheme" content="dark">
  <title>Starweave</title>
  <link rel="stylesheet" href="app.css">
  <script src="cordova.js" defer></script>
  <script src="page-controls.js" defer></script>
  <script src="app.js" defer></script>
</head>
<body>
  <main>
    <img class="logo" src="icon.svg" alt="" width="80" height="80">
    <h1>Starweave</h1>
    <p class="tagline">让每个智能体，与世界相连</p>
    <form id="connectionForm" hidden>
      <label for="serverUrl">服务地址</label>
      <input id="serverUrl" name="serverUrl" type="url" inputmode="url" autocomplete="url" autocapitalize="none" spellcheck="false" placeholder="https://starweave.example.com" required>
      <p class="hint">填写手机可访问的 Starweave 网页地址</p>
      <button id="connectButton" type="submit" disabled>连接 Starweave</button>
      <p id="status" role="status" aria-live="polite"></p>
    </form>
  </main>
</body>
</html>
